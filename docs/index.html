<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Women of Legend</title>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>

  <style>
    :root{
      --bg1:#03142d;
      --bg2:#072b5f;
      --bg3:#0a4f9a;
      --metal1:#89c8ff;
      --metal2:#4ea6ff;
      --metal3:#1f5ea8;
      --text:#f5fbff;
      --muted:#c6dbef;
      --line:rgba(255,255,255,0.16);
      --glass:rgba(7,28,58,0.62);
      --glass-2:rgba(10,37,72,0.82);
      --country:#f7fbff;
      --shadow:0 24px 70px rgba(0,0,0,0.35);
      --radius:26px;
    }

    *{box-sizing:border-box}
    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 20% 18%, rgba(121,188,255,0.28), transparent 24%),
        radial-gradient(circle at 80% 16%, rgba(38,120,216,0.32), transparent 22%),
        radial-gradient(circle at 50% 100%, rgba(8,71,138,0.30), transparent 40%),
        linear-gradient(145deg, var(--bg1) 0%, var(--bg2) 54%, var(--bg3) 100%);
      color:var(--text);
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background:
        linear-gradient(120deg, rgba(255,255,255,0.12), transparent 18%, transparent 78%, rgba(255,255,255,0.06)),
        radial-gradient(circle at 30% 8%, rgba(255,255,255,0.12), transparent 16%);
      mix-blend-mode:screen;
      opacity:0.45;
    }

    .app{
      width:100vw;
      height:100vh;
      padding:14px;
    }

    .frame{
      position:relative;
      width:100%;
      height:100%;
      overflow:hidden;
      border-radius:32px;
      border:1px solid rgba(255,255,255,0.16);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.01)),
        radial-gradient(circle at 50% 40%, rgba(141,201,255,0.10), transparent 34%),
        linear-gradient(180deg, rgba(5,29,61,0.88), rgba(4,24,53,0.92));
      box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,0.14);
      backdrop-filter: blur(14px);
    }

    .frame::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.10), transparent 18%, transparent 82%, rgba(255,255,255,0.05));
      opacity:0.55;
    }

    .hud{
      position:absolute;
      inset:18px 18px auto 18px;
      z-index:30;
      display:flex;
      justify-content:space-between;
      gap:18px;
      align-items:flex-start;
    }

    .brand{
      max-width:520px;
      padding:14px 18px;
      border-radius:22px;
      border:1px solid rgba(255,255,255,0.14);
      background:linear-gradient(180deg, rgba(10,39,76,0.88), rgba(7,26,53,0.76));
      backdrop-filter:blur(16px);
      box-shadow:var(--shadow);
    }

    .brand h1{
      margin:0;
      font-family:Georgia, "Times New Roman", serif;
      font-size:clamp(28px,3.2vw,46px);
      line-height:0.95;
      letter-spacing:-0.05em;
    }

    .brand p{
      margin:8px 0 0;
      color:var(--muted);
      line-height:1.5;
      font-size:14px;
    }

    .quote-box{
      width:min(430px, 34vw);
      min-height:110px;
      padding:16px 18px;
      border-radius:22px;
      border:1px solid rgba(255,255,255,0.14);
      background:linear-gradient(180deg, rgba(13,46,89,0.84), rgba(7,25,50,0.74));
      backdrop-filter:blur(16px);
      box-shadow:var(--shadow);
      display:flex;
      flex-direction:column;
      justify-content:center;
    }

    .quote-label{
      text-transform:uppercase;
      font-size:11px;
      letter-spacing:0.14em;
      color:#9fd2ff;
      font-weight:800;
      margin-bottom:8px;
    }

    .quote-text{
      font-family:Georgia, "Times New Roman", serif;
      font-size:20px;
      line-height:1.35;
      color:#f7fbff;
      opacity:0;
      transform:translateY(6px);
      transition:opacity 1.1s ease, transform 1.1s ease;
      min-height:54px;
    }

    .quote-text.show{
      opacity:1;
      transform:translateY(0);
    }

    .quote-author{
      margin-top:10px;
      font-size:12px;
      color:#b6d6f5;
      font-weight:700;
      opacity:0;
      transform:translateY(6px);
      transition:opacity 1.1s ease, transform 1.1s ease;
    }

    .quote-author.show{
      opacity:1;
      transform:translateY(0);
    }

    .controls{
      position:absolute;
      left:18px;
      right:18px;
      bottom:18px;
      z-index:28;
      display:flex;
      justify-content:space-between;
      gap:16px;
      align-items:flex-end;
    }

    .legend{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      padding:12px 14px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,0.14);
      background:rgba(7,28,58,0.72);
      backdrop-filter:blur(14px);
      box-shadow:var(--shadow);
      color:var(--muted);
      font-size:12px;
      font-weight:700;
      max-width:420px;
    }

    .dot{
      width:10px;
      height:10px;
      border-radius:50%;
      background:#66b6ff;
      box-shadow:0 0 14px rgba(102,182,255,0.85);
    }

    .filter-wrap{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      justify-content:flex-end;
      max-width:720px;
    }

    .filter-btn{
      border:none;
      cursor:pointer;
      color:#d8e9f7;
      background:linear-gradient(180deg, rgba(20,73,135,0.84), rgba(10,39,75,0.84));
      border:1px solid rgba(255,255,255,0.14);
      border-radius:999px;
      padding:10px 14px;
      font-size:12px;
      font-weight:800;
      box-shadow:inset 0 1px 0 rgba(255,255,255,0.12);
    }

    .filter-btn.active{
      background:linear-gradient(180deg, rgba(108,189,255,0.36), rgba(27,96,169,0.92));
      color:#fff;
    }

    #map{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      z-index:1;
    }

    .country{
      fill:var(--country);
      stroke:rgba(4,33,76,0.24);
      stroke-width:0.6;
      vector-effect:non-scaling-stroke;
    }

    .country.active{
      fill:#7fc2ff;
      stroke:rgba(255,255,255,0.60);
      stroke-width:0.95;
    }

    .graticule{
      fill:none;
      stroke:rgba(255,255,255,0.07);
      stroke-width:0.7;
    }

    .marker-layer{
      position:absolute;
      inset:0;
      z-index:16;
      pointer-events:none;
    }

    .marker{
      position:absolute;
      width:54px;
      height:54px;
      transform:translate(-50%,-50%);
      pointer-events:auto;
    }

    .marker-btn{
      width:54px;
      height:54px;
      border-radius:50%;
      overflow:hidden;
      border:2px solid rgba(255,255,255,0.84);
      outline:2px solid rgba(92,177,255,0.50);
      background:linear-gradient(145deg, rgba(111,196,255,0.35), rgba(23,84,148,0.94));
      box-shadow:
        0 12px 28px rgba(0,0,0,0.30),
        0 0 18px rgba(98,184,255,0.54),
        inset 0 2px 8px rgba(255,255,255,0.22);
      cursor:pointer;
      padding:0;
      display:grid;
      place-items:center;
      transition:transform .22s ease, box-shadow .22s ease;
    }

    .marker-btn:hover{
      transform:scale(1.08);
      box-shadow:
        0 16px 32px rgba(0,0,0,0.34),
        0 0 24px rgba(98,184,255,0.75),
        inset 0 2px 10px rgba(255,255,255,0.28);
    }

    .marker-btn img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .fallback{
      display:none;
      width:100%;
      height:100%;
      place-items:center;
      font-family:Georgia, serif;
      font-size:20px;
      font-weight:800;
      color:white;
      background:
        radial-gradient(circle at 30% 30%, rgba(255,255,255,0.18), transparent 22%),
        linear-gradient(145deg, rgba(118,203,255,0.35), rgba(23,84,148,0.98));
    }

    .pulse{
      position:absolute;
      inset:-7px;
      border-radius:50%;
      border:1px solid rgba(126,199,255,0.38);
      animation:pulse 2.6s infinite;
      pointer-events:none;
    }

    @keyframes pulse{
      0%{transform:scale(0.92); opacity:0.88}
      70%{transform:scale(1.22); opacity:0}
      100%{transform:scale(1.22); opacity:0}
    }

    .marker-label{
      position:absolute;
      left:50%;
      top:58px;
      transform:translateX(-50%);
      white-space:nowrap;
      font-size:10px;
      font-weight:800;
      color:#f0f8ff;
      background:rgba(7,28,58,0.82);
      border:1px solid rgba(255,255,255,0.12);
      border-radius:999px;
      padding:5px 8px;
      opacity:0;
      transition:opacity .22s ease;
      pointer-events:none;
    }

    .marker:hover .marker-label{
      opacity:1;
    }

    .story-card{
      position:absolute;
      right:18px;
      top:158px;
      width:min(430px, 32vw);
      min-height:320px;
      max-height:calc(100% - 290px);
      z-index:24;
      border-radius:24px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,0.16);
      background:linear-gradient(180deg, rgba(9,35,69,0.94), rgba(6,24,48,0.92));
      box-shadow:var(--shadow);
      backdrop-filter:blur(16px);
      display:flex;
      flex-direction:column;
      opacity:0;
      transform:translateX(20px);
      pointer-events:none;
      transition:opacity .28s ease, transform .28s ease;
    }

    .story-card.open{
      opacity:1;
      transform:translateX(0);
      pointer-events:auto;
    }

    .story-top{
      display:grid;
      grid-template-columns:112px 1fr;
      gap:14px;
      padding:16px;
      border-bottom:1px solid rgba(255,255,255,0.08);
    }

    .story-top img{
      width:112px;
      height:112px;
      border-radius:18px;
      object-fit:cover;
      background:#14355d;
    }

    .story-eyebrow{
      color:#9fd2ff;
      font-size:11px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:0.12em;
    }

    .story-name{
      margin:6px 0 4px;
      font-family:Georgia, serif;
      font-size:32px;
      line-height:0.95;
      letter-spacing:-0.05em;
    }

    .story-loc{
      color:#80c5ff;
      font-weight:800;
      font-size:13px;
    }

    .story-body{
      padding:16px;
      display:flex;
      flex-direction:column;
      gap:12px;
      min-height:0;
      overflow:hidden;
    }

    .story-summary{
      color:#e5f1fb;
      line-height:1.58;
      font-size:14px;
      display:-webkit-box;
      -webkit-line-clamp:6;
      -webkit-box-orient:vertical;
      overflow:hidden;
    }

    .tag-row{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .tag{
      padding:7px 10px;
      border-radius:10px;
      font-size:11px;
      font-weight:800;
      border:1px solid rgba(255,255,255,0.12);
      background:rgba(255,255,255,0.06);
      color:#eef7ff;
    }

    .story-actions{
      margin-top:auto;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .story-actions button{
      border:none;
      cursor:pointer;
      border-radius:999px;
      padding:11px 14px;
      font-size:12px;
      font-weight:800;
      color:white;
      background:linear-gradient(180deg, rgba(102,182,255,0.32), rgba(31,94,168,0.92));
      border:1px solid rgba(255,255,255,0.14);
      box-shadow:inset 0 1px 0 rgba(255,255,255,0.12);
    }

    .close-story{
      position:absolute;
      top:10px;
      right:10px;
      width:32px;
      height:32px;
      border-radius:50%;
      border:1px solid rgba(255,255,255,0.15);
      background:rgba(255,255,255,0.06);
      color:white;
      font-size:18px;
      cursor:pointer;
    }

    .story-modal{
      position:absolute;
      inset:0;
      z-index:40;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      background:rgba(2,11,24,0.56);
      backdrop-filter:blur(8px);
      opacity:0;
      pointer-events:none;
      transition:opacity .24s ease;
    }

    .story-modal.open{
      opacity:1;
      pointer-events:auto;
    }

    .modal-card{
      width:min(720px, 88vw);
      border-radius:28px;
      padding:24px;
      border:1px solid rgba(255,255,255,0.16);
      background:linear-gradient(180deg, rgba(11,41,80,0.95), rgba(6,23,45,0.94));
      box-shadow:var(--shadow);
      max-height:82vh;
      overflow:hidden;
      position:relative;
    }

    .modal-card h2{
      margin:8px 0 8px;
      font-family:Georgia, serif;
      font-size:clamp(34px,4.8vw,54px);
      line-height:0.96;
      letter-spacing:-0.06em;
    }

    .modal-card p{
      color:#e5f1fb;
      line-height:1.75;
      font-size:15px;
      margin:0;
    }

    .close-modal{
      position:absolute;
      top:14px;
      right:14px;
      width:36px;
      height:36px;
      border-radius:50%;
      border:1px solid rgba(255,255,255,0.15);
      background:rgba(255,255,255,0.06);
      color:white;
      font-size:18px;
      cursor:pointer;
    }

    @media (max-width: 1200px){
      .quote-box{width:360px}
      .story-card{width:380px}
    }

    @media (max-width: 980px){
      .hud{
        flex-direction:column;
        align-items:stretch;
      }
      .quote-box{
        width:100%;
        min-height:90px;
      }
      .story-card{
        width:min(92vw, 420px);
        right:14px;
        top:auto;
        bottom:88px;
        max-height:320px;
      }
      .controls{
        flex-direction:column;
        align-items:stretch;
      }
      .filter-wrap{
        justify-content:flex-start;
      }
      .legend{
        max-width:none;
      }
      .marker{
        width:46px;height:46px;
      }
      .marker-btn{
        width:46px;height:46px;
      }
      .marker-label{display:none}
    }

    @media (max-width: 640px){
      .app{padding:8px}
      .frame{border-radius:20px}
      .brand h1{font-size:30px}
      .brand p{font-size:12px}
      .quote-text{font-size:17px}
      .story-top{grid-template-columns:84px 1fr}
      .story-top img{width:84px;height:84px}
      .story-name{font-size:24px}
      .story-card{bottom:72px}
      .filter-btn{padding:8px 10px;font-size:11px}
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="frame">
      <div class="hud">
        <div class="brand">
          <h1>Women of Legend</h1>
          <p>
            Folklore, resistance and women’s agency across continents.
            Click a portrait on the map to open the story layer.
          </p>
        </div>

        <div class="quote-box">
          <div class="quote-label">Voices on women’s rights</div>
          <div id="quoteText" class="quote-text"></div>
          <div id="quoteAuthor" class="quote-author"></div>
        </div>
      </div>

      <svg id="map" aria-label="World map"></svg>
      <div id="markerLayer" class="marker-layer"></div>

      <div id="storyCard" class="story-card">
        <button id="closeStory" class="close-story" aria-label="Close">×</button>
        <div class="story-top">
          <img id="storyImage" alt="" />
          <div>
            <div id="storyEyebrow" class="story-eyebrow"></div>
            <div id="storyName" class="story-name"></div>
            <div id="storyLoc" class="story-loc"></div>
          </div>
        </div>
        <div class="story-body">
          <div id="storySummary" class="story-summary"></div>
          <div id="storyTags" class="tag-row"></div>
          <div class="story-actions">
            <button id="openModalBtn">Read full story</button>
          </div>
        </div>
      </div>

      <div id="storyModal" class="story-modal">
        <div class="modal-card">
          <button id="closeModal" class="close-modal" aria-label="Close">×</button>
          <div id="modalEyebrow" class="story-eyebrow"></div>
          <h2 id="modalTitle"></h2>
          <div id="modalLoc" class="story-loc" style="margin-bottom:14px;"></div>
          <p id="modalBody"></p>
        </div>
      </div>

      <div class="controls">
        <div class="legend">
          <span class="dot"></span>
          Portrait markers are placed at their country coordinates. Blue-highlighted countries are active folklore locations.
        </div>
        <div id="filters" class="filter-wrap"></div>
      </div>
    </div>
  </div>

  <script>
    const quotes = [
      { text: "There is no limit to what we, as women, can accomplish.", author: "Michelle Obama" },
      { text: "I raise up my voice — not so I can shout, but so that those without a voice can be heard.", author: "Malala Yousafzai" },
      { text: "Women belong in all places where decisions are being made.", author: "Ruth Bader Ginsburg" },
      { text: "I would rather be a rebel than a slave.", author: "Emmeline Pankhurst" },
      { text: "Ain’t I a woman?", author: "Sojourner Truth" },
      { text: "Freedom cannot be achieved unless women have been emancipated from all forms of oppression.", author: "Nelson Mandela" }
    ];

    const stories = [
      {id:"yaa",name:"Yaa Asantewaa",country:"Ghana",continent:"Africa",coords:[-1.02,7.95],iso:"288",era:"The Asante Queen",image:"assets/faces/yaa.svg",initials:"YA",tags:["Resistance","Leadership","Folklore"],summary:"In 1900, when British forces demanded the Golden Stool, Yaa Asantewaa rallied the Asante and led resistance.",body:"Yaa Asantewaa is remembered as a queen mother and strategist whose story blends history and cultural memory. She represents political authority, resistance to colonial domination and the refusal to surrender collective dignity."},
      {id:"amina",name:"Queen Amina",country:"Nigeria",continent:"Africa",coords:[7.72,11.08],iso:"566",era:"Hausa Warrior Queen",image:"assets/faces/amina.svg",initials:"QA",tags:["Rule","Strategy","Legend"],summary:"Queen Amina of Zazzau is remembered as a formidable ruler whose story preserves female sovereignty.",body:"Amina’s memory survives through chronicles and oral tradition. She stands for female political power, command and the challenge to the idea that leadership in the precolonial state was solely male."},
      {id:"mekatilili",name:"Mekatilili wa Menza",country:"Kenya",continent:"Africa",coords:[39.85,-3.63],iso:"404",era:"Giriama Resistance",image:"assets/faces/mekatilili.svg",initials:"MM",tags:["Anti-colonial","Oral Tradition","Leadership"],summary:"Mekatilili is remembered for mobilising Giriama resistance against colonial labour demands and cultural control.",body:"Mekatilili wa Menza is a powerful figure in Kenyan memory. Her story connects women’s agency to speech, ritual authority and resistance to cultural and political domination."},
      {id:"agojie",name:"Agojie",country:"Benin",continent:"Africa",coords:[2.31,9.31],iso:"204",era:"Dahomey Women Warriors",image:"assets/faces/agojie.svg",initials:"AG",tags:["Warriors","Power","Complex History"],summary:"The Agojie were an all-female regiment of Dahomey remembered for discipline, training and battlefield power.",body:"The Agojie complicate easy empowerment narratives. They are evidence that women occupied elite military roles, but their world must be understood within the wider politics of the Dahomey kingdom."},
      {id:"arawelo",name:"Queen Arawelo",country:"Somalia",continent:"Africa",coords:[46.19,5.15],iso:"706",era:"Somali Legendary Queen",image:"assets/faces/arawelo.svg",initials:"AR",tags:["Myth","Authority","Debate"],summary:"Arawelo is a contested legendary queen, interpreted as either feminist resistance or excessive power.",body:"Arawelo is valuable precisely because she is contested. Her story reveals how folklore can carry both admiration for women’s rule and social anxiety about it."},

      {id:"mulan",name:"Hua Mulan",country:"China",continent:"Asia",coords:[104.19,35.86],iso:"156",era:"Ballad of Mulan",image:"assets/faces/mulan.svg",initials:"HM",tags:["Legend","Duty","Courage"],summary:"Mulan takes her father’s place in war, unsettling assumptions about gender and public duty.",body:"Mulan is not a modern rights activist, but her story is potent because it exposes the fragility of the idea that courage, duty and sacrifice belong naturally to men."},
      {id:"trung",name:"Trưng Sisters",country:"Vietnam",continent:"Asia",coords:[105.83,21.03],iso:"704",era:"Rebellion Leaders",image:"assets/faces/trung-sisters.svg",initials:"TS",tags:["Rebellion","Sovereignty","Leadership"],summary:"The Trưng Sisters led rebellion against Han domination and became symbols of Vietnamese independence.",body:"The Trưng Sisters fuse female leadership with national freedom. Their story matters because it challenges the assumption that anti-imperial struggle is fundamentally masculine."},
      {id:"lakshmibai",name:"Rani Lakshmibai",country:"India",continent:"Asia",coords:[78.57,25.45],iso:"356",era:"Queen of Jhansi",image:"assets/faces/rani-lakshmibai.svg",initials:"RL",tags:["Rebellion","Sovereignty","Courage"],summary:"Rani Lakshmibai is remembered as a queen who fought colonial annexation during the 1857 uprising.",body:"Lakshmibai’s memory lives through poetry and public legend. She represents sovereignty, maternal strength, political legitimacy and the refusal to accept colonial rule."},
      {id:"tomoe",name:"Tomoe Gozen",country:"Japan",continent:"Asia",coords:[138.25,36.20],iso:"392",era:"Warrior of the Heike",image:"assets/faces/tomoe-gozen.svg",initials:"TG",tags:["Warrior","Legend","Honour"],summary:"Tomoe Gozen is remembered as a woman warrior associated with battlefield skill and martial honour.",body:"Tomoe Gozen sits between literature and history. Her symbolic power lies in demonstrating that courage, combat and honour were not exclusively male domains."},

    ];

    const continents = ["All","Africa","Asia","Europe","North America","South America","Oceania"];
    let selectedContinent = "All";
    let selectedStory = null;

    const svg = d3.select("#map");
    const markerLayer = document.getElementById("markerLayer");
    const filtersEl = document.getElementById("filters");

    const storyCard = document.getElementById("storyCard");
    const closeStory = document.getElementById("closeStory");
    const storyImage = document.getElementById("storyImage");
    const storyEyebrow = document.getElementById("storyEyebrow");
    const storyName = document.getElementById("storyName");
    const storyLoc = document.getElementById("storyLoc");
    const storySummary = document.getElementById("storySummary");
    const storyTags = document.getElementById("storyTags");
    const openModalBtn = document.getElementById("openModalBtn");

    const storyModal = document.getElementById("storyModal");
    const closeModal = document.getElementById("closeModal");
    const modalEyebrow = document.getElementById("modalEyebrow");
    const modalTitle = document.getElementById("modalTitle");
    const modalLoc = document.getElementById("modalLoc");
    const modalBody = document.getElementById("modalBody");

    const quoteText = document.getElementById("quoteText");
    const quoteAuthor = document.getElementById("quoteAuthor");

    function visibleStories(){
      return selectedContinent === "All"
        ? stories
        : stories.filter(d => d.continent === selectedContinent);
    }

    function normaliseIso(id){
      return String(id).padStart(3, "0");
    }

    function createFilters(){
      filtersEl.innerHTML = "";
      continents.forEach(continent => {
        const btn = document.createElement("button");
        btn.className = `filter-btn ${continent === selectedContinent ? "active" : ""}`;
        btn.textContent = continent;
        btn.addEventListener("click", () => {
          selectedContinent = continent;
          createFilters();
          renderMap();
          if (selectedStory && selectedStory.continent !== selectedContinent && selectedContinent !== "All"){
            hideStory();
          }
        });
        filtersEl.appendChild(btn);
      });
    }

    function openStory(story){
      selectedStory = story;
      storyImage.src = story.image;
      storyImage.alt = story.name;
      storyEyebrow.textContent = story.era;
      storyName.textContent = story.name;
      storyLoc.textContent = `📍 ${story.country} · ${story.continent}`;
      storySummary.textContent = story.summary;
      storyTags.innerHTML = story.tags.map(tag => `<span class="tag">${tag}</span>`).join("");
      storyCard.classList.add("open");
    }

    function hideStory(){
      storyCard.classList.remove("open");
    }

    function openModal(){
      if(!selectedStory) return;
      modalEyebrow.textContent = selectedStory.era;
      modalTitle.textContent = selectedStory.name;
      modalLoc.textContent = `📍 ${selectedStory.country} · ${selectedStory.continent}`;
      modalBody.textContent = selectedStory.body;
      storyModal.classList.add("open");
    }

    closeStory.addEventListener("click", hideStory);
    openModalBtn.addEventListener("click", openModal);
    closeModal.addEventListener("click", () => storyModal.classList.remove("open"));
    storyModal.addEventListener("click", (e) => {
      if (e.target === storyModal) storyModal.classList.remove("open");
    });

    function startQuoteRotation(){
      let index = 0;

      function showQuote(i){
        quoteText.classList.remove("show");
        quoteAuthor.classList.remove("show");

        setTimeout(() => {
          quoteText.textContent = `“${quotes[i].text}”`;
          quoteAuthor.textContent = `— ${quotes[i].author}`;
          quoteText.classList.add("show");
          quoteAuthor.classList.add("show");
        }, 350);
      }

      showQuote(index);

      setInterval(() => {
        quoteText.classList.remove("show");
        quoteAuthor.classList.remove("show");

        setTimeout(() => {
          index = (index + 1) % quotes.length;
          quoteText.textContent = `“${quotes[index].text}”`;
          quoteAuthor.textContent = `— ${quotes[index].author}`;
          quoteText.classList.add("show");
          quoteAuthor.classList.add("show");
        }, 1000);
      }, 8000);
    }

    async function renderMap(){
      const frame = document.querySelector(".frame");
      const width = frame.clientWidth;
      const height = frame.clientHeight;

      svg.selectAll("*").remove();
      markerLayer.innerHTML = "";
      svg.attr("viewBox", `0 0 ${width} ${height}`);

      const projection = d3.geoNaturalEarth1()
        .fitExtent([[26, 110], [width - 26, height - 110]], { type: "Sphere" });

      const path = d3.geoPath(projection);
      const graticule = d3.geoGraticule10();

      const world = await d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json");
      const countries = topojson.feature(world, world.objects.countries).features;

      const visible = visibleStories();
      const activeIso = new Set(visible.map(d => d.iso));

      svg.append("path")
        .datum(graticule)
        .attr("class", "graticule")
        .attr("d", path);

      svg.append("g")
        .selectAll("path")
        .data(countries)
        .join("path")
        .attr("class", d => activeIso.has(normaliseIso(d.id)) ? "country active" : "country")
        .attr("d", path);

      visible.forEach(story => {
        const [x, y] = projection(story.coords);

        const marker = document.createElement("div");
        marker.className = "marker";
        marker.style.left = `${x}px`;
        marker.style.top = `${y}px`;

        marker.innerHTML = `
          <div class="pulse"></div>
          <button class="marker-btn" aria-label="${story.name}">
            <img src="${story.image}" alt="${story.name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='grid';">
            <span class="fallback">${story.initials}</span>
          </button>
          <div class="marker-label">${story.name}</div>
        `;

        marker.querySelector("button").addEventListener("click", () => openStory(story));
        markerLayer.appendChild(marker);
      });
    }

    createFilters();
    startQuoteRotation();
    renderMap();

    let resizeTimer = null;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(renderMap, 120);
    });
  </script>
