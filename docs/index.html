<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Women of Legend · v4 Bigger Map</title>
  <!-- v4-bigger-map: quote top strip, compact title, larger map, desktop layout protected from tablet breakpoint -->

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>

  <style>
    :root{
      --deep:#02142f;
      --navy:#062a5f;
      --blue:#58b8ff;
      --ice:#f8fcff;
      --muted:#bdd8ef;
      --panel:rgba(5,27,61,.58);
      --panel2:rgba(7,36,79,.76);
      --stroke:rgba(255,255,255,.15);
      --shadow:0 28px 90px rgba(0,0,0,.36);
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      color:#fff;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:
        radial-gradient(circle at 18% 18%, rgba(111,190,255,.27), transparent 26%),
        radial-gradient(circle at 82% 20%, rgba(42,113,221,.30), transparent 24%),
        linear-gradient(135deg,#03122a 0%,#062f69 58%,#084f9e 100%);
    }

    body:before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.48;
      mix-blend-mode:screen;
      background:linear-gradient(130deg,rgba(255,255,255,.16),transparent 18%,transparent 80%,rgba(255,255,255,.08));
    }

    .app{
      width:100vw;
      height:100vh;
      padding:14px;
    }

    .frame{
      position:relative;
      width:100%;
      height:100%;
      overflow:hidden;
      border-radius:30px;
      border:1px solid rgba(255,255,255,.18);
      background:
        radial-gradient(circle at 50% 52%, rgba(108,184,255,.12), transparent 36%),
        linear-gradient(180deg,rgba(7,42,90,.82),rgba(2,17,39,.92));
      box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.16);
    }

    .frame:after{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background:linear-gradient(145deg,rgba(255,255,255,.10),transparent 20%,transparent 82%,rgba(255,255,255,.06));
    }

    /* v4: slim quote strip at the very top */
    .quote{
      position:absolute;
      z-index:34;
      top:10px;
      left:50%;
      transform:translateX(-50%);
      width:min(780px, calc(100% - 36px));
      min-height:52px;
      padding:8px 13px;
      border-radius:15px;
      border:1px solid var(--stroke);
      background:linear-gradient(180deg,rgba(12,53,109,.70),rgba(4,20,46,.46));
      backdrop-filter:blur(16px);
      box-shadow:0 12px 34px rgba(0,0,0,.18);
    }

    .quote small{
      display:block;
      text-transform:uppercase;
      letter-spacing:.14em;
      color:#a6d9ff;
      font-size:8.5px;
      font-weight:900;
      margin-bottom:4px;
    }

    .quote-text{
      font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(13px,.96vw,18px);
      line-height:1.12;
      min-height:20px;
      opacity:0;
      transform:translateY(6px);
      transition:opacity 1.1s ease,transform 1.1s ease;
    }

    .quote-author{
      font-size:9.5px;
      color:#bcd9f4;
      font-weight:850;
      margin-top:3px;
      opacity:0;
      transform:translateY(6px);
      transition:opacity 1.1s ease,transform 1.1s ease;
    }

    .quote-text.show,.quote-author.show{
      opacity:1;
      transform:translateY(0);
    }

    /* v4: compact title card so the map stays dominant */
    .brand{
      position:absolute;
      z-index:33;
      top:70px;
      left:18px;
      width:min(300px,22vw);
      padding:9px 12px;
      border-radius:16px;
      border:1px solid var(--stroke);
      background:linear-gradient(180deg,rgba(9,38,82,.66),rgba(4,20,46,.44));
      backdrop-filter:blur(16px);
      box-shadow:0 12px 34px rgba(0,0,0,.18);
    }

    .brand h1{
      margin:0;
      font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(21px,1.9vw,32px);
      line-height:.92;
      letter-spacing:-.055em;
    }

    .brand p{
      margin:5px 0 0;
      color:var(--muted);
      font-size:10.5px;
      line-height:1.32;
    }

    #map{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      z-index:1;
    }

    .country{
      fill:#fbfdff;
      stroke:rgba(2,21,48,.24);
      stroke-width:.55;
      vector-effect:non-scaling-stroke;
    }

    .country.active{
      fill:#78c6ff;
      stroke:rgba(255,255,255,.70);
      stroke-width:.9;
    }

    .graticule{
      fill:none;
      stroke:rgba(255,255,255,.065);
      stroke-width:.65;
    }

    .marker-layer{
      position:absolute;
      inset:0;
      z-index:18;
      pointer-events:none;
    }

    .marker{
      position:absolute;
      width:40px;
      height:40px;
      transform:translate(-50%,-50%);
      pointer-events:auto;
    }

    .marker button{
      width:40px;
      height:40px;
      border-radius:50%;
      padding:0;
      cursor:pointer;
      overflow:hidden;
      display:grid;
      place-items:center;
      border:2px solid rgba(255,255,255,.86);
      outline:2px solid rgba(91,183,255,.46);
      background:linear-gradient(145deg,rgba(123,203,255,.34),rgba(18,82,154,.96));
      box-shadow:
        0 11px 24px rgba(0,0,0,.34),
        0 0 18px rgba(95,184,255,.56),
        inset 0 1px 7px rgba(255,255,255,.22);
      transition:transform .2s ease,box-shadow .2s ease;
    }

    .marker button:hover{
      transform:scale(1.14);
      box-shadow:
        0 16px 34px rgba(0,0,0,.36),
        0 0 27px rgba(95,184,255,.86);
    }

    .marker img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .pulse{
      position:absolute;
      inset:-7px;
      border-radius:50%;
      border:1px solid rgba(125,202,255,.36);
      animation:pulse 2.6s infinite;
      pointer-events:none;
    }

    @keyframes pulse{
      0%{transform:scale(.92);opacity:.9}
      72%{transform:scale(1.28);opacity:0}
      100%{opacity:0}
    }

    .label{
      position:absolute;
      left:50%;
      top:44px;
      transform:translateX(-50%);
      white-space:nowrap;
      padding:4px 8px;
      border-radius:999px;
      background:rgba(3,20,46,.78);
      border:1px solid rgba(255,255,255,.12);
      color:#f4fbff;
      font-size:9px;
      font-weight:900;
      opacity:0;
      transition:opacity .2s ease;
      pointer-events:none;
    }

    .marker:hover .label{opacity:1}

    .story{
      position:absolute;
      z-index:32;
      right:18px;
      bottom:58px;
      width:min(340px,25vw);
      border-radius:20px;
      overflow:hidden;
      border:1px solid var(--stroke);
      background:linear-gradient(180deg,rgba(8,37,80,.94),rgba(3,17,39,.92));
      box-shadow:var(--shadow);
      backdrop-filter:blur(16px);
      opacity:0;
      transform:translateY(18px);
      pointer-events:none;
      transition:.26s ease;
    }

    .story.open{
      opacity:1;
      transform:translateY(0);
      pointer-events:auto;
    }

    .story-top{
      display:grid;
      grid-template-columns:72px 1fr;
      gap:12px;
      padding:13px;
      border-bottom:1px solid rgba(255,255,255,.08);
    }

    .story-top img{
      width:72px;
      height:72px;
      border-radius:15px;
      object-fit:cover;
      background:#123969;
    }

    .eyebrow{
      text-transform:uppercase;
      letter-spacing:.12em;
      font-size:10px;
      font-weight:900;
      color:#9fd6ff;
    }

    .story h2{
      margin:6px 0 4px;
      font-family:Georgia,serif;
      font-size:23px;
      line-height:.94;
      letter-spacing:-.05em;
    }

    .loc{
      font-size:12px;
      font-weight:850;
      color:#84c9ff;
    }

    .story-body{
      padding:13px;
      display:flex;
      flex-direction:column;
      gap:9px;
    }

    .summary{
      font-size:12.5px;
      line-height:1.5;
      color:#e5f1fb;
    }

    .tags{
      display:flex;
      flex-wrap:wrap;
      gap:7px;
    }

    .tag{
      font-size:9px;
      font-weight:850;
      padding:6px 9px;
      border-radius:9px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.06);
    }

    .read{
      width:max-content;
      border:1px solid rgba(255,255,255,.14);
      border-radius:999px;
      color:white;
      background:linear-gradient(180deg,rgba(99,183,255,.32),rgba(28,92,169,.9));
      font-size:11.5px;
      font-weight:900;
      padding:9px 12px;
      cursor:pointer;
    }

    .close{
      position:absolute;
      right:10px;
      top:10px;
      width:30px;
      height:30px;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.16);
      background:rgba(255,255,255,.06);
      color:#fff;
      font-size:17px;
      cursor:pointer;
    }

    .modal{
      position:absolute;
      inset:0;
      z-index:50;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:22px;
      background:rgba(1,9,22,.58);
      backdrop-filter:blur(10px);
      opacity:0;
      pointer-events:none;
      transition:.25s ease;
    }

    .modal.open{
      opacity:1;
      pointer-events:auto;
    }

    .modal-card{
      position:relative;
      width:min(680px,86vw);
      border-radius:26px;
      padding:24px;
      border:1px solid var(--stroke);
      background:linear-gradient(180deg,rgba(9,42,91,.96),rgba(4,20,46,.96));
      box-shadow:var(--shadow);
    }

    .modal h2{
      margin:8px 0 8px;
      font-family:Georgia,serif;
      font-size:clamp(34px,4.6vw,54px);
      letter-spacing:-.06em;
      line-height:.94;
    }

    .modal p{
      margin:0;
      color:#e6f3ff;
      font-size:15px;
      line-height:1.75;
    }

    .modal .close{
      right:14px;
      top:14px;
    }

    .bottom{
      position:absolute;
      z-index:31;
      left:18px;
      right:18px;
      bottom:10px;
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      gap:12px;
    }

    .legend{
      display:flex;
      align-items:center;
      gap:8px;
      max-width:260px;
      padding:7px 9px;
      border-radius:14px;
      border:1px solid var(--stroke);
      background:rgba(3,22,51,.56);
      backdrop-filter:blur(14px);
      color:var(--muted);
      font-size:9px;
      font-weight:850;
    }

    .dot{
      width:9px;
      height:9px;
      border-radius:50%;
      background:#69bdff;
      box-shadow:0 0 14px rgba(105,189,255,.9);
      flex:none;
    }

    .filters{
      display:flex;
      flex-wrap:wrap;
      gap:6px;
      justify-content:flex-end;
    }

    .filters button{
      padding:6px 9px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.16);
      background:linear-gradient(180deg,rgba(19,72,135,.76),rgba(7,35,78,.76));
      color:#d9ecfb;
      font-size:10px;
      font-weight:900;
      cursor:pointer;
    }

    .filters button.active{
      color:#fff;
      background:linear-gradient(180deg,rgba(100,190,255,.38),rgba(28,98,176,.9));
    }

    @media(max-width:700px){
      .quote{
        top:10px;
        left:14px;
        right:14px;
        transform:none;
        width:auto;
        min-height:68px;
      }

      .quote-text{
        font-size:16px;
        min-height:24px;
      }

      .brand{
        top:72px;
        left:14px;
        width:calc(100% - 28px);
        max-width:none;
      }

      .story{
        width:calc(100% - 28px);
        right:14px;
        bottom:82px;
      }

      .bottom{
        align-items:stretch;
        flex-direction:column;
      }

      .legend{
        max-width:none;
      }

      .filters{
        justify-content:flex-start;
      }

      .marker,.marker button{
        width:42px;
        height:42px;
      }

      .label{
        display:none;
      }
    }

    @media(max-width:620px){
      .app{padding:8px}
      .frame{border-radius:20px}
      .quote{top:8px;left:8px;right:8px;padding:10px 12px}
      .brand{top:76px;left:8px;width:calc(100% - 16px);padding:10px 12px}
      .brand h1{font-size:28px}
      .brand p{font-size:11.5px}
      .bottom{left:8px;right:8px;bottom:8px}
      .filters button{padding:7px 9px;font-size:9.5px}
      .story{left:8px;right:8px;width:auto;bottom:76px}
      .story-top{grid-template-columns:72px 1fr}
      .story-top img{width:72px;height:72px}
      .story h2{font-size:23px}
    }
  </style>
</head>

<body>
<div class="app">
  <main class="frame">
    <section class="quote">
      <small>Voices on women’s rights</small>
      <div id="quoteText" class="quote-text"></div>
      <div id="quoteAuthor" class="quote-author"></div>
    </section>

    <section class="brand">
      <h1>Women of Legend</h1>
      <p>Folklore, resistance and women’s agency across continents. Click a portrait to open the story layer.</p>
    </section>

    <svg id="map" aria-label="World map"></svg>
    <div id="markerLayer" class="marker-layer"></div>

    <article id="story" class="story">
      <button id="closeStory" class="close">×</button>
      <div class="story-top">
        <img id="storyImg" alt="">
        <div>
          <div id="storyEra" class="eyebrow"></div>
          <h2 id="storyName"></h2>
          <div id="storyLoc" class="loc"></div>
        </div>
      </div>
      <div class="story-body">
        <div id="storySummary" class="summary"></div>
        <div id="storyTags" class="tags"></div>
        <button id="readFull" class="read">Read full story</button>
      </div>
    </article>

    <section id="modal" class="modal">
      <div class="modal-card">
        <button id="closeModal" class="close">×</button>
        <div id="modalEra" class="eyebrow"></div>
        <h2 id="modalName"></h2>
        <div id="modalLoc" class="loc" style="margin-bottom:14px"></div>
        <p id="modalBody"></p>
      </div>
    </section>

    <section class="bottom">
      <div class="legend"><span class="dot"></span><span>v4 layout · Portraits sit on country coordinates. Highlighted countries are active story locations.</span></div>
      <div id="filters" class="filters"></div>
    </section>
  </main>
</div>

<script>
const quotes=[
  {text:"There is no limit to what we, as women, can accomplish.",author:"Michelle Obama"},
  {text:"I raise up my voice — not so I can shout, but so that those without a voice can be heard.",author:"Malala Yousafzai"},
  {text:"Women belong in all places where decisions are being made.",author:"Ruth Bader Ginsburg"},
  {text:"I would rather be a rebel than a slave.",author:"Emmeline Pankhurst"},
  {text:"Ain’t I a woman?",author:"Sojourner Truth"},
  {text:"Freedom cannot be achieved unless women have been emancipated from all forms of oppression.",author:"Nelson Mandela"}
];

const stories=[
{id:"yaa",name:"Yaa Asantewaa",country:"Ghana",continent:"Africa",coords:[-1.02,7.95],iso:"288",era:"The Asante Queen",image:"assets/faces/yaa.svg",tags:["Resistance","Leadership","Folklore"],summary:"In 1900, when British forces demanded the Golden Stool, Yaa Asantewaa rallied the Asante and led resistance.",body:"Yaa Asantewaa is remembered as a queen mother and strategist whose story blends history and cultural memory. She represents political authority, resistance to colonial domination and the refusal to surrender collective dignity."},
{id:"amina",name:"Queen Amina",country:"Nigeria",continent:"Africa",coords:[7.72,11.08],iso:"566",era:"Hausa Warrior Queen",image:"assets/faces/amina.svg",tags:["Rule","Strategy","Legend"],summary:"Queen Amina of Zazzau is remembered as a formidable ruler whose story preserves female sovereignty.",body:"Amina’s memory survives through chronicles and oral tradition. She stands for female political power, command and the challenge to the idea that leadership in the precolonial state was solely male."},
{id:"mekatilili",name:"Mekatilili wa Menza",country:"Kenya",continent:"Africa",coords:[39.85,-3.63],iso:"404",era:"Giriama Resistance",image:"assets/faces/mekatilili.svg",tags:["Anti-colonial","Oral Tradition","Leadership"],summary:"Mekatilili is remembered for mobilising Giriama resistance against colonial labour demands and cultural control.",body:"Mekatilili wa Menza is a powerful figure in Kenyan memory. Her story connects women’s agency to speech, ritual authority and resistance to cultural and political domination."},
{id:"agojie",name:"Agojie",country:"Benin",continent:"Africa",coords:[2.31,9.31],iso:"204",era:"Dahomey Women Warriors",image:"assets/faces/agojie.svg",tags:["Warriors","Power","Complex History"],summary:"The Agojie were an all-female regiment of Dahomey remembered for discipline, training and battlefield power.",body:"The Agojie complicate easy empowerment narratives. They are evidence that women occupied elite military roles, but their world must be understood within the wider politics of the Dahomey kingdom."},
{id:"arawelo",name:"Queen Arawelo",country:"Somalia",continent:"Africa",coords:[46.19,5.15],iso:"706",era:"Somali Legendary Queen",image:"assets/faces/arawelo.svg",tags:["Myth","Authority","Debate"],summary:"Arawelo is a contested legendary queen, interpreted as either feminist resistance or excessive power.",body:"Arawelo is valuable precisely because she is contested. Her story reveals how folklore can carry both admiration for women’s rule and social anxiety about it."},

{id:"mulan",name:"Hua Mulan",country:"China",continent:"Asia",coords:[104.19,35.86],iso:"156",era:"Ballad of Mulan",image:"assets/faces/mulan.svg",tags:["Legend","Duty","Courage"],summary:"Mulan takes her father’s place in war, unsettling assumptions about gender and public duty.",body:"Mulan is not a modern rights activist, but her story is potent because it exposes the fragility of the idea that courage, duty and sacrifice belong naturally to men."},
{id:"trung",name:"Trưng Sisters",country:"Vietnam",continent:"Asia",coords:[105.83,21.03],iso:"704",era:"Rebellion Leaders",image:"assets/faces/trung-sisters.svg",tags:["Rebellion","Sovereignty","Leadership"],summary:"The Trưng Sisters led rebellion against Han domination and became symbols of Vietnamese independence.",body:"The Trưng Sisters fuse female leadership with national freedom. Their story matters because it challenges the assumption that anti-imperial struggle is fundamentally masculine."},
{id:"lakshmibai",name:"Rani Lakshmibai",country:"India",continent:"Asia",coords:[78.57,25.45],iso:"356",era:"Queen of Jhansi",image:"https://commons.wikimedia.org/wiki/Special:FilePath/Rani_Lakshmibai_contemporary_portrait.jpg",tags:["Rebellion","Sovereignty","Courage"],summary:"Rani Lakshmibai is remembered as a queen who fought colonial annexation during the 1857 uprising.",body:"Lakshmibai’s memory lives through poetry and public legend. She represents sovereignty, maternal strength, political legitimacy and the refusal to accept colonial rule."},
{id:"tomoe",name:"Tomoe Gozen",country:"Japan",continent:"Asia",coords:[138.25,36.20],iso:"392",era:"Warrior of the Heike",image:"assets/faces/tomoe-gozen.svg",tags:["Warrior","Legend","Honour"],summary:"Tomoe Gozen is remembered as a woman warrior associated with battlefield skill and martial honour.",body:"Tomoe Gozen sits between literature and history. Her symbolic power lies in demonstrating that courage, combat and honour were not exclusively male domains."},
{id:"gabriela",name:"Gabriela Silang",country:"Philippines",continent:"Asia",coords:[120.98,14.60],iso:"608",era:"Revolutionary Leader",image:"assets/faces/gabriela-silang.svg",tags:["Revolt","Anti-colonial","Leadership"],summary:"Gabriela Silang took command of revolt and became a symbol of revolutionary female leadership.",body:"Gabriela Silang’s story is more than personal courage after loss. It represents a woman’s movement into command, organisation and public rebellion."},

{id:"boudicca",name:"Boudicca",country:"Britain",continent:"Europe",coords:[0.12,52.20],iso:"826",era:"Iceni Queen",image:"assets/faces/boudicca.svg",tags:["Revolt","Justice","Sovereignty"],summary:"Boudicca led revolt against Roman rule after violence against her family and people.",body:"Boudicca’s story has been repeatedly retold and politicised, yet its central force remains clear: a woman refuses imperial humiliation and turns private injury into collective resistance."},
{id:"joan",name:"Joan of Arc",country:"France",continent:"Europe",coords:[2.21,46.23],iso:"250",era:"Saint and Soldier",image:"https://commons.wikimedia.org/wiki/Special:FilePath/Joan_of_arc.png",tags:["Faith","War","Mythologised"],summary:"Joan of Arc became a symbol of courage, divine conviction and national liberation.",body:"Joan of Arc matters because she crossed class, gender and political boundaries. A peasant girl claimed authority and changed the course of history as remembered by later generations."},
{id:"grace",name:"Grace O’Malley",country:"Ireland",continent:"Europe",coords:[-9.06,53.80],iso:"372",era:"Pirate Queen",image:"assets/faces/grace-omalley.svg",tags:["Sea Power","Autonomy","Leadership"],summary:"Grace O’Malley is remembered as a sea captain and clan leader who defended autonomy.",body:"Grace O’Malley’s legend is about command, negotiation and maritime power. She shows women’s authority in a domain usually imagined as male."},
{id:"maria",name:"María Pita",country:"Spain",continent:"Europe",coords:[-8.41,43.36],iso:"724",era:"Defender of A Coruña",image:"assets/faces/maria-pita.svg",tags:["Defence","Civic Courage","Memory"],summary:"María Pita is remembered for defending A Coruña and becoming a symbol of civic courage.",body:"María Pita represents the ordinary woman transformed into a civic legend. She embodies public action, courage and communal defence."},
{id:"brites",name:"Brites de Almeida",country:"Portugal",continent:"Europe",coords:[-8.22,39.66],iso:"620",era:"The Baker of Aljubarrota",image:"assets/faces/brites.svg",tags:["Folklore","Resistance","Working Woman"],summary:"Brites de Almeida is a legendary baker said to have fought invaders.",body:"Brites de Almeida’s appeal lies in her ordinariness. She is not remembered as elite, but as a working woman elevated by folklore into a national symbol."},

{id:"adelita",name:"La Adelita",country:"Mexico",continent:"North America",coords:[-102.55,23.63],iso:"484",era:"Soldadera Symbol",image:"assets/faces/adelita.svg",tags:["Revolution","Song","Contested Memory"],summary:"La Adelita symbolises women’s participation in the Mexican Revolution, though often through romanticised memory.",body:"La Adelita stands for the soldaderas who fought, nursed, supplied and endured the revolution. The symbol is powerful, but it should not erase the hardship those women faced."},
{id:"nanny",name:"Nanny of the Maroons",country:"Jamaica",continent:"North America",coords:[-77.30,18.10],iso:"388",era:"Maroon Leader",image:"assets/faces/nanny.svg",tags:["Freedom","Anti-slavery","Oral Tradition"],summary:"Nanny of the Maroons is remembered for guerrilla leadership and anti-slavery resistance.",body:"Nanny’s place in memory is central because it puts a Black woman at the heart of freedom, strategy and communal survival."},

const continents=["All","Africa","Asia","Europe","North America","South America","Oceania"];
let selected="All", activeStory=null;

const svg=d3.select("#map");
const markerLayer=document.getElementById("markerLayer");
const filters=document.getElementById("filters");
const story=document.getElementById("story");
const storyImg=document.getElementById("storyImg");
const storyEra=document.getElementById("storyEra");
const storyName=document.getElementById("storyName");
const storyLoc=document.getElementById("storyLoc");
const storySummary=document.getElementById("storySummary");
const storyTags=document.getElementById("storyTags");
const modal=document.getElementById("modal");
const modalEra=document.getElementById("modalEra");
const modalName=document.getElementById("modalName");
const modalLoc=document.getElementById("modalLoc");
const modalBody=document.getElementById("modalBody");
const quoteText=document.getElementById("quoteText");
const quoteAuthor=document.getElementById("quoteAuthor");

function visible(){
  return selected==="All" ? stories : stories.filter(d=>d.continent===selected);
}

function norm(id){
  return String(id).padStart(3,"0");
}

function makeFilters(){
  filters.innerHTML="";
  continents.forEach(c=>{
    const b=document.createElement("button");
    b.textContent=c;
    b.className=c===selected ? "active" : "";
    b.onclick=()=>{
      selected=c;
      makeFilters();
      render();
      if(activeStory && selected!=="All" && activeStory.continent!==selected){
        story.classList.remove("open");
      }
    };
    filters.appendChild(b);
  });
}

function openStory(s){
  activeStory=s;
  storyImg.onerror=function(){ this.onerror=null; this.src=`assets/faces/${s.id === 'lakshmibai' ? 'rani-lakshmibai' : s.id}.svg`; };
  storyImg.src=s.image;
  storyEra.textContent=s.era;
  storyName.textContent=s.name;
  storyLoc.textContent=`📍 ${s.country} · ${s.continent}`;
  storySummary.textContent=s.summary;
  storyTags.innerHTML=s.tags.map(t=>`<span class="tag">${t}</span>`).join("");
  story.classList.add("open");
}

document.getElementById("closeStory").onclick=()=>story.classList.remove("open");

document.getElementById("readFull").onclick=()=>{
  if(!activeStory) return;
  modalEra.textContent=activeStory.era;
  modalName.textContent=activeStory.name;
  modalLoc.textContent=`📍 ${activeStory.country} · ${activeStory.continent}`;
  modalBody.textContent=activeStory.body;
  modal.classList.add("open");
};

document.getElementById("closeModal").onclick=()=>modal.classList.remove("open");

modal.onclick=e=>{
  if(e.target===modal) modal.classList.remove("open");
};

function rotateQuotes(){
  let i=0;

  function show(){
    quoteText.classList.remove("show");
    quoteAuthor.classList.remove("show");

    setTimeout(()=>{
      quoteText.textContent=`“${quotes[i].text}”`;
      quoteAuthor.textContent=`— ${quotes[i].author}`;
      quoteText.classList.add("show");
      quoteAuthor.classList.add("show");
    },450);
  }

  show();

  setInterval(()=>{
    i=(i+1)%quotes.length;
    show();
  },8000);
}

async function render(){
  const frame=document.querySelector(".frame");
  const w=frame.clientWidth;
  const h=frame.clientHeight;

  svg.selectAll("*").remove();
  markerLayer.innerHTML="";
  svg.attr("viewBox",`0 0 ${w} ${h}`);

  /* Larger map: more width and height, less vertical padding */
  const projection=d3.geoNaturalEarth1()
    .fitExtent([[10,42],[w-10,h-42]],{type:"Sphere"});

  const path=d3.geoPath(projection);
  const world=await d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json");
  const countries=topojson.feature(world,world.objects.countries).features;

  const vis=visible();
  const ids=new Set(vis.map(d=>d.iso));

  svg.append("path")
    .datum(d3.geoGraticule10())
    .attr("class","graticule")
    .attr("d",path);

  svg.append("g")
    .selectAll("path")
    .data(countries)
    .join("path")
    .attr("class",d=>ids.has(norm(d.id)) ? "country active" : "country")
    .attr("d",path);

  vis.forEach(s=>{
    const [x,y]=projection(s.coords);
    const m=document.createElement("div");
    m.className="marker";
    m.style.left=`${x}px`;
    m.style.top=`${y}px`;
    m.innerHTML=`
      <div class="pulse"></div>
      <button aria-label="${s.name}">
        <img src="${s.image}" alt="${s.name}" onerror="this.onerror=null; this.src=`assets/faces/${s.id === 'lakshmibai' ? 'rani-lakshmibai' : s.id}.svg`;">
      </button>
      <div class="label">${s.name}</div>
    `;
    m.querySelector("button").onclick=()=>openStory(s);
    markerLayer.appendChild(m);
  });
}

makeFilters();
rotateQuotes();
render();

let timer;
window.addEventListener("resize",()=>{
  clearTimeout(timer);
  timer=setTimeout(render,120);
});
</script>
